# Copy to .github/workflows/verify.yml after PAT has `workflow` scope.
name: verify-free-core
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,crypto]"
      - run: python -m pytest -q
      - run: python scripts/check_data_cards.py
      - run: python scripts/check_seal_freshness.py
      - run: python scripts/public_verify_harness.py
      - run: python scripts/redteam_nano_harness.py
      - run: python scripts/oneshot_verify_all.py
      - run: python scripts/check_dns_status.py
