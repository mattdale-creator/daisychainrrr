name: verify-free-core

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,crypto]"
      - name: Pytest
        run: python -m pytest -q
      - name: Data cards
        run: python scripts/check_data_cards.py
      - name: Seal freshness
        run: python scripts/check_seal_freshness.py
      - name: Public unpaid verify harness
        run: python scripts/public_verify_harness.py
      - name: Red-team nano harness
        run: python scripts/redteam_nano_harness.py
      - name: Oneshot verify
        run: python scripts/oneshot_verify_all.py
